name: Release

# Builds the VSIX and the project template ZIP, and publishes them as a GitHub release.
#
# - Push a tag such as v1.2.3 to release that version, or
# - run the workflow manually and enter a version; the tag v<version> is created
#   on the selected branch.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3). The tag v<version> is created.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Determine version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME -replace '^v', '' }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') {
              throw "Invalid version '$version'. Use two to four numeric parts, e.g. 1.2.3."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build VSIX and ZIP
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./Build-Template.ps1 -Version $env:VERSION

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          gh release create $env:TAG `
            dist/FileSystemMiniFilter.vsix `
            dist/FileSystemMiniFilter.zip `
            --title $env:TAG `
            --target $env:TARGET `
            --generate-notes
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
